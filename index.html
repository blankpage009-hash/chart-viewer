<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 두 손가락 확대는 앱이 직접 처리하므로 화면 자체 확대는 막는다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chart Viewer</title>

  <!-- 홈 화면에 앱처럼 설치되기 위한 정보 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#123a5e">
  <!-- 아이패드에서 홈 화면 아이콘으로 열면 주소창 없이 전체 화면으로 뜬다 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Charts">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── 상단 바 ───────────────────────────────── -->
  <header class="topbar">
    <!-- 글자(☰)는 기기마다 굵기·크기가 달라 보여서, 모양이 고정되는 그림으로 그린다 -->
    <button id="btn-sidebar" class="icon-btn" title="목록 접기/펴기">
      <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
        <rect y="0"  width="16" height="2" rx="1" fill="currentColor"/>
        <rect y="5"  width="16" height="2" rx="1" fill="currentColor"/>
        <rect y="10" width="16" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>

    <img class="brand" src="jeppesen_icon.png" alt="JEPPESEN">

    <div class="search-wrap">
      <input id="search" type="search" placeholder="ICAO · 공항 이름 · 국가로 검색  (예: RKSS, Gimpo, Korea)"
             autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="btn-search-clear" class="clear-btn" title="지우기">×</button>
    </div>

    <!-- 즐겨찾기한 공항이 여기에 아이콘 칩으로 나열된다. 누르면 그 공항으로 바로 검색된다 -->
    <div class="fav-airports" id="fav-airports"></div>

    <div class="top-actions">
      <!-- 글자(▯▯)는 사이가 벌어져서, 간격을 직접 정할 수 있는 그림으로 그린다 -->
      <button id="btn-split" class="icon-btn" title="차트 두 개 나란히 보기">
        <svg class="split-icon" width="20" height="16" viewBox="0 0 20 16" aria-hidden="true">
          <rect x="1.1" y="1.1" width="8.1" height="13.8" rx="1.6"
                fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="10.8" y="1.1" width="8.1" height="13.8" rx="1.6"
                fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="설정">
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.31-.09.63-.09.94s.02.63.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z"/>
        </svg>
      </button>
      <button id="btn-add" class="text-btn primary">Upload</button>
      <!-- 실제 파일 선택창. 화면에는 보이지 않고 [PDF 추가] 버튼이 대신 누른다 -->
      <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
  </header>

  <!-- ── 본문 ─────────────────────────────────── -->
  <div class="layout" id="layout">

    <!-- 왼쪽 목록 -->
    <aside class="sidebar" id="sidebar">
      <section class="list-section">
        <button class="section-head" data-toggle="fav-body">
          <span class="caret">▾</span> Favorite <span class="count" id="fav-count">0</span>
        </button>
        <div class="section-body" id="fav-body"></div>
      </section>

      <section class="list-section">
        <button class="section-head" data-toggle="result-body">
          <span class="caret">▾</span> Result <span class="count" id="result-count">0</span>
        </button>
        <div class="section-body" id="result-body"></div>
      </section>

      <footer class="store-info" id="store-info"></footer>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <!-- 가운데 차트 보는 곳 -->
    <main class="viewers" id="viewers">

      <section class="viewer is-active" data-pane="0">
        <div class="viewer-bar">
          <span class="viewer-title">차트를 선택하세요</span>
          <span class="spacer"></span>
          <span class="page-nav" hidden>
            <button class="icon-btn small" data-act="prev" title="이전 장">‹</button>
            <span class="page-label">1 / 1</span>
            <button class="icon-btn small" data-act="next" title="다음 장">›</button>
          </span>
          <button class="icon-btn small" data-act="zoom-out" title="축소">－</button>
          <button class="icon-btn small zoom-label" data-act="fit" title="화면에 맞춤">100%</button>
          <button class="icon-btn small" data-act="zoom-in" title="확대">＋</button>
          <button class="icon-btn small" data-act="rotate" title="회전">
            <svg class="rotate-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 6h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
          <button class="icon-btn small" data-act="fullscreen" title="전체 화면">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0h2v6h-6v-2h4v-4z"/>
            </svg>
          </button>
          <button class="icon-btn small" data-act="fav" title="즐겨찾기">☆</button>
          <button class="icon-btn small" data-act="close" title="닫기">×</button>
        </div>
        <div class="viewer-body">
          <div class="chart-stage">
            <canvas class="chart-canvas" hidden></canvas>
            <div class="chart-placeholder">
              <p class="ph-hint">왼쪽 목록에서 차트를 고르세요</p>
            </div>
          </div>
        </div>
      </section>

      <section class="viewer" data-pane="1" hidden>
        <div class="viewer-bar">
          <span class="viewer-title">차트를 선택하세요</span>
          <span class="spacer"></span>
          <span class="page-nav" hidden>
            <button class="icon-btn small" data-act="prev" title="이전 장">‹</button>
            <span class="page-label">1 / 1</span>
            <button class="icon-btn small" data-act="next" title="다음 장">›</button>
          </span>
          <button class="icon-btn small" data-act="zoom-out" title="축소">－</button>
          <button class="icon-btn small zoom-label" data-act="fit" title="화면에 맞춤">100%</button>
          <button class="icon-btn small" data-act="zoom-in" title="확대">＋</button>
          <button class="icon-btn small" data-act="rotate" title="회전">
            <svg class="rotate-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 6h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
          <button class="icon-btn small" data-act="fullscreen" title="전체 화면">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0h2v6h-6v-2h4v-4z"/>
            </svg>
          </button>
          <button class="icon-btn small" data-act="fav" title="즐겨찾기">☆</button>
          <button class="icon-btn small" data-act="close" title="닫기">×</button>
        </div>
        <div class="viewer-body">
          <div class="chart-stage">
            <canvas class="chart-canvas" hidden></canvas>
            <div class="chart-placeholder">
              <p class="ph-hint">왼쪽 목록에서 차트를 고르세요</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ── 설정 창 (Airport = 공항 이름·국가 / Files = 넣어둔 PDF 관리) ── -->
  <div class="modal-scrim" id="settings-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Settings</h2>
        <button class="icon-btn" data-close-modal>×</button>
      </div>

      <nav class="modal-tabs" id="modal-tabs">
        <button class="tab-btn is-on" data-tab="airport">Airport</button>
        <button class="tab-btn" data-tab="files">Files</button>
      </nav>

      <section class="tab-panel" data-panel="airport">
        <p class="modal-note">여기에 적은 이름과 국가로도 검색됩니다. 고치면 바로 저장됩니다.</p>
        <div class="airport-table" id="airport-table"></div>
      </section>

      <section class="tab-panel" data-panel="files" hidden>
        <div class="file-search">
          <input id="file-search" type="search" placeholder="차트 찾기 (ICAO · 번호 · 이름 · 파일 이름)"
                 autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        </div>
        <div class="file-tools">
          <label class="check-all"><input type="checkbox" id="file-all"> 전체 선택</label>
          <span class="file-sum" id="file-sum"></span>
          <button class="text-btn danger" id="btn-file-del" disabled>선택 삭제</button>
        </div>
        <div class="file-table" id="file-table"></div>
      </section>

      <div class="modal-foot">
        <button class="text-btn primary" data-close-modal>닫기</button>
      </div>
    </div>
  </div>

  <!-- ── 진행 표시 ────────────────────────────── -->
  <div class="busy" id="busy" hidden><div class="busy-box" id="busy-text"></div></div>

  <!-- ── 안내 토스트 ──────────────────────────── -->
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
